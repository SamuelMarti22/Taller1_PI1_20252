{% extends 'base.html' %} {% block content %}
<h1>Recomendaciones</h1>
<p>Danos un tema y te damos la película que mejor se adecue</p>
<form action="{% url 'recommendations' %}" method="get">
  <div class="mb-3">
    <label for="prompt" class="form-label"> Search for Movie: </label>
    <input type="text" id="prompt" class="form-control" name="prompt" />
  </div>
  <button type="submit" class="btn btn-primary">Search</button>
</form>
{% if movie %}
<div v-for="movie in movies" class="col">
  <div class="card">
    <img src="{{ movie.image.url }}" class="card-img-top" alt="..." />
    <div class="card-body">
      <h5 class="card-title">{{ movie.title }}</h5>
      <p class="card-text">{{ movie.description }}</p>
      <p class="card-text">{{movie.genre}}</p>
      <p class="card-text">{{movie.year}}</p>
      {% if movie.url %}
      <a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
      {% endif %}
    </div>
  </div>
</div>
{% endif %} 
{% endblock content %}
